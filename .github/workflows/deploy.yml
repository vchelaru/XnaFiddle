name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # This is the real deploy: the published output is uploaded as the GitHub Pages artifact below.
      # (The E2E workflow also runs `dotnet publish`, but only to serve the app locally to a test
      # browser — see e2e.yml. Same command, different purpose.)
      - name: Publish for GitHub Pages deploy
        run: dotnet publish XnaFiddle.BlazorGL/XnaFiddle.BlazorGL.csproj -c Release -o output

      # Catches a publish-pipeline regression (missing asset, wrong compressed variant,
      # non-deterministic fingerprinting) before it reaches Pages -- see #132 postmortem,
      # where a hashed framework .wasm 503'd/failed SRI on first load after a full SDK bump.
      # This does NOT catch CDN edge-propagation lag after the deploy; that's covered by the
      # smoke-check step below.
      - name: Verify Blazor boot asset integrity
        shell: pwsh
        run: .github/scripts/Verify-BlazorAssetIntegrity.ps1 -WwwrootPath output/wwwroot

      - name: Add .nojekyll
        run: New-Item -Path output/wwwroot/.nojekyll -ItemType File -Force
        shell: pwsh

      - name: Upload Pages artifact
        # Do NOT upgrade to v4+ — v4 excludes dotfiles by default with no opt-out,
        # which would drop .nojekyll and break GitHub Pages builds.
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # actions/deploy-pages reporting success only means GitHub's backend accepted the
      # deployment, not that every CDN edge node in front of Pages has picked it up yet (#132
      # postmortem). Sample a few live boot assets with retries so a lingering propagation
      # window fails this workflow run instead of silently greeting the first visitor.
      - name: Smoke-check live deploy
        shell: pwsh
        run: .github/scripts/Test-LiveBootAssets.ps1 -BaseUrl "${{ steps.deployment.outputs.page_url }}"
